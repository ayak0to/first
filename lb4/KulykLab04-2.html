<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Лабораторна робота №4">
  <title>Лабораторна робота №4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Рядки, що біжать</h1>

  <marquee class="band" width="100%" height="50" bgcolor="#FFD6A5" direction="left" behavior="alternate" loop="12" scrollamount="8" scrolldelay="30" style="color:#4B1D3F; font-weight:bold; font-size:24px; font-family:Verdana, sans-serif;">
    Текст коливається з боку в бік.
  </marquee>

  <marquee class="band" width="92%" height="50" bgcolor="#BEE3FF" direction="right" behavior="scroll" loop="-1" scrollamount="12" scrolldelay="45" style="color:#123456; font-weight:bold; font-size:22px; font-family:Arial, sans-serif;">
    Текст пробігає справа наліво і знову з’являється.
  </marquee>

  <marquee class="band" width="90%" height="50" bgcolor="#D9F7D9" direction="left" behavior="slide" loop="1" scrollamount="10" scrolldelay="60" style="color:#154D14; font-weight:bold; font-size:22px; font-family:Tahoma, sans-serif;">
    Текст пробігає зліва направо і зупиняється.
  </marquee>

  <marquee class="band" width="100%" height="50" bgcolor="#F9D5E5" direction="left" behavior="scroll" loop="-1" scrollamount="9" scrolldelay="90" style="color:#5C1A4A; font-size:20px; font-family:'Trebuchet MS', sans-serif;">
    Перший рядок із запізненням 90 мс — рухається рівномірно і безперервно.
  </marquee>

  <marquee class="band" width="100%" height="50" bgcolor="#E7E7B5" direction="right" behavior="scroll" loop="-1" scrollamount="6" scrolldelay="150" style="color:#3B3B00; font-size:20px; font-family:'Comic Sans MS', cursive;">
    Другий рядок із запізненням 150 мс — має більш повільний рух.
  </marquee>
</body>
</html>
